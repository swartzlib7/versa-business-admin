# Versa - Business Admin behind nginx, with HTTPS (1.0.20, Ops Manual §2.9 "Public access").
#
# 1. Replace every example.com with your domain (keep www.example.com as www.<domain>).
# 2. Point the domain and www at this server, then get the certificate:
#      sudo certbot certonly --nginx -d example.com -d www.example.com
# 3. Start VBA on the loopback only, so nothing reaches it except through nginx:
#      ./node_modules/.bin/next start -H 127.0.0.1 -p 3200
# 4. sudo cp deploy/nginx/vba.conf /etc/nginx/sites-available/vba
#    sudo ln -s /etc/nginx/sites-available/vba /etc/nginx/sites-enabled/vba
#    sudo nginx -t && sudo systemctl reload nginx
#
# What VBA needs from the proxy: the visitor's Host and https (X-Forwarded-Proto) so
# sign-in cookies and links are right; X-Real-IP so the access-token limit counts the
# real caller; uploads up to 25 MB; time for an integration batch.

limit_req_zone $binary_remote_addr zone=vba:10m rate=10r/s;

# http:// → https://example.com
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://example.com$request_uri; }
}

# https://www.example.com → https://example.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Attachments and pictures up to 25 MB (nginx's default is 1 MB).
    client_max_body_size 25m;
    server_tokens off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Turn on once HTTPS has been settled for a while (browsers then refuse http for a year):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Page files: many per first visit, so outside the rate limit.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Integration exchange (push batches, pull pages): larger bursts, longer answers.
    location /api/exchange {
        limit_req zone=vba burst=40 nodelay;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=vba burst=20 nodelay;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
